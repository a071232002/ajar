name: 每日產生學習卡

# 台北 05:00 產卡，05:30 由 daily-audio.yml 接手補語音。
# 跑在 GitHub 雲端，不需要開著電腦；用 Claude 訂閱的長效 token，不需要 API key。
on:
  schedule:
    - cron: "0 21 * * *" # UTC 21:00 = 台北 05:00
  workflow_dispatch:

# 同時只跑一個，避免手動觸發和排程撞在一起送出兩張卡
concurrency:
  group: daily-lesson
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安裝 Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: 產生今日學習卡
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # prompt 只引用變數名，值不會出現在 repo 或執行紀錄裡
          APP_URL: https://ajar-two.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          claude -p "$(cat .github/lesson-prompt.md)" \
            --allowedTools Bash Write Read \
            --model claude-opus-5
