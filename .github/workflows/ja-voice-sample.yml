name: 日文語音試聽樣本

# 一次性驗證：Kokoro 的日語語音在 CI 上跑不跑得動、音質能不能接受。
# kokoro-js 的 phonemizer 只支援英語，日語要走 Python 的 misaki[ja]。
on:
  workflow_dispatch:

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝 Kokoro 與日語 G2P
        run: |
          python -m pip install --quiet --upgrade pip
          # torch 裝 CPU 版就好，省下大量下載時間
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "kokoro>=0.9.4" "misaki[ja]" soundfile
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng

      - name: 產生五顆日語語音的樣本
        run: |
          mkdir -p out
          python - <<'PY'
          import soundfile as sf
          from kokoro import KPipeline

          # lang_code 'j' = 日語
          pipe = KPipeline(lang_code="j")

          # 用旅遊／生活的實際句子，順便評估訪客頁的內容手感
          CASES = [
              ("jf_alpha",      "すみません、この電車は空港に行きますか。"),
              ("jf_gongitsune", "チェックインをお願いします。予約はしてあります。"),
              ("jf_nezumi",     "お会計は別々でお願いできますか。"),
              ("jf_tebukuro",   "この近くにコンビニはありますか。"),
              ("jm_kumo",       "すみません、もう一度ゆっくり言っていただけますか。"),
          ]

          for voice, text in CASES:
              audio = []
              for _, _, a in pipe(text, voice=voice):
                  audio.append(a)
              import numpy as np
              wav = np.concatenate(audio) if len(audio) > 1 else audio[0]
              sf.write(f"out/{voice}.wav", wav, 24000)
              print(f"  {voice:16} {text}")
          PY
          ls -la out

      - name: 轉成 mp3 並上傳
        env:
          SB: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          sudo apt-get install -y -qq ffmpeg
          for f in out/*.wav; do
            n=$(basename "$f" .wav)
            ffmpeg -loglevel error -y -i "$f" -codec:a libmp3lame -q:a 4 "out/$n.mp3"
            curl -sS -X POST \
              "$SB/storage/v1/object/lesson-audio/ja-sample/$n.mp3" \
              -H "apikey: $KEY" -H "authorization: Bearer $KEY" \
              -H "content-type: audio/mpeg" -H "x-upsert: true" \
              --data-binary "@out/$n.mp3" -o /dev/null -w "  $n.mp3  HTTP %{http_code}\n"
          done
          echo
          echo "試聽網址："
          for f in out/*.mp3; do
            echo "  $SB/storage/v1/object/public/lesson-audio/ja-sample/$(basename "$f")"
          done
